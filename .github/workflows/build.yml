name: Build HotbarCustom

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project zip if needed
        run: |
          if [ ! -f build.gradle ]; then
            for z in *.zip; do unzip -o "$z"; done
          fi
          if [ -d HotbarCustom ] && [ -f HotbarCustom/build.gradle ]; then
            cp -R HotbarCustom/. .
          fi
          ls -la
          test -f build.gradle
          test -f gradle.properties

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle 9.2.1
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.2.1-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-9.2.1/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Build with Gradle
        run: |
          set -o pipefail
          gradle build --no-daemon --console=plain 2>&1 | tee build.log
          ls -lh build/libs/

      - name: Inspect built JAR
        run: |
          set -e
          JAR="$(ls build/libs/hotbarcustom-*.jar | grep -v sources | head -n 1)"
          echo "JAR=$JAR"
          {
            echo "=== JAR ==="
            echo "$JAR"
            echo
            echo "=== Contents ==="
            unzip -l "$JAR"
            echo
            echo "=== fabric.mod.json ==="
            unzip -p "$JAR" fabric.mod.json
            echo
            echo "=== Required entries check ==="
            unzip -l "$JAR" | grep -E "HotbarCustomClient" || { echo "MISSING: client class"; exit 1; }
            unzip -l "$JAR" | grep -E "lang/ja_jp.json" || { echo "MISSING: ja_jp lang"; exit 1; }
            unzip -l "$JAR" | grep -E "lang/en_us.json" || { echo "MISSING: en_us lang"; exit 1; }
            echo "client class and lang files are present."
          } 2>&1 | tee inspection_report.txt
          cp "$JAR" hotbarcustom-1.0.0.jar

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HOTBARCUSTOM-1.0.0
          path: |
            hotbarcustom-1.0.0.jar
            build.log
            inspection_report.txt
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hotbarcustom-build-log-failure
          path: |
            build.log
            inspection_report.txt
          if-no-files-found: ignore
